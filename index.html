<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中央区（勝どき）天気予報</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb;font-family:"Yu Gothic","Meiryo",sans-serif;color:#111}#screen{position:fixed;inset:0;overflow:hidden}#page{position:absolute;width:1920px;height:1080px;transform-origin:top left;background:#f4f7fb}.header{height:100px;background:#075faa;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 40px}.title{font-size:34px;font-weight:700}.update{font-size:24px}.publish{height:55px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}.cards{height:740px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:0 22px}.card{height:740px;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 4px 12px #0003}.day{height:155px;background:#075faa;color:#fff;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:700}.icon{height:265px;display:flex;align-items:center;justify-content:center;padding:0}.icon img{width:300px;height:300px;object-fit:contain}.weather{height:80px;display:flex;align-items:center;justify-content:center;padding:10px 20px;font-size:28px;font-weight:700;white-space:nowrap}.temp{height:130px;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#d62828;white-space:nowrap}.rain{height:110px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#0675d1}.footer{height:85px;display:flex;align-items:center;justify-content:center;color:#666;font-size:20px}.error{color:#b00020;font-weight:700}
</style>
</head>
<body><div id="screen"><div id="page">
<div class="header"><div class="title">中央区（勝どき）天気予報</div><div class="update" id="updateTime">画面更新：--</div></div>
<div class="publish" id="publishTime">気象庁発表：--</div>
<div class="cards" id="cards"></div>
<div class="footer">データ提供：気象庁　中央区（東京地方）の予報</div>
</div></div>
<script>
const BASE_WIDTH=1920,BASE_HEIGHT=1080;
function fitPage(){const p=document.getElementById('page'),x=innerWidth/BASE_WIDTH,y=innerHeight/BASE_HEIGHT,s=Math.min(x,y);p.style.transform=`translate(${(innerWidth-BASE_WIDTH*s)/2}px,${(innerHeight-BASE_HEIGHT*s)/2}px) scale(${s})`}
addEventListener('resize',fitPage);fitPage();
function parseCSV(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quote&&n==='"'){cell+='"';i++}else if(c==='"'){quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else{cell+=c}}if(cell||row.length){row.push(cell);rows.push(row)}const head=rows.shift().map((v,i)=>i===0?v.replace(/^\uFEFF/,''):v);return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])))}
function temp(v){return v===''?'--':v}
async function load(){try{const res=await fetch(`data/weather.csv?t=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw new Error(`CSV ${res.status}`);const data=parseCSV(await res.text());if(data.length<3)throw new Error('CSVの行数不足');document.getElementById('updateTime').textContent=`画面更新：${data[0].updated_time}`;document.getElementById('publishTime').textContent=`気象庁発表：${data[0].report_time}`;document.getElementById('cards').innerHTML=data.slice(0,3).map(d=>`<section class="card"><div class="day">${d.label}</div><div class="icon"><img src="${d.icon}" alt="${d.weather}"></div><div class="weather">${d.weather}</div><div class="temp">${temp(d.temp_max)}℃ / ${temp(d.temp_min)}℃</div><div class="rain">降水確率 ${d.rain===''?'--':d.rain}%</div></section>`).join('')}catch(e){document.getElementById('publishTime').innerHTML=`<span class="error">データ読込エラー：${e.message}</span>`}}
load();setInterval(load,5*60*1000);
</script></body></html>
