name: Update weather CSV

on:
  schedule:
    - cron: "10 20,2,8 * * *"  # JST 05:10, 11:10, 17:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch JMA data and create CSV
        run: python scripts/update_weather.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.csv icons/*.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update weather data"
            git push
          fi
